<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.c{fill:#fff;stroke:#dbe7f5;stroke-width:1.5;rx:18;filter:url(#s)}.bad{fill:#fff1f2;stroke:#fecdd3;stroke-width:1.5;rx:18;filter:url(#s)}.ok{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5;rx:18;filter:url(#s)}.t{font:700 30px Inter,Arial;fill:#0f172a}.st{font:500 14px Inter,Arial;fill:#64748b}.h{font:700 18px Inter,Arial;fill:#0f172a}.p{font:500 13px Inter,Arial;fill:#64748b}.x{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="520" rx="26" fill="#f8fbff"/><text class="t" x="70" y="62">Laravel Authentication Security Lab · Comparative Security Flows</text><text class="st" x="70" y="90">A controlled lab showing how validation, throttling, session protection and CSRF change authentication posture</text><rect class="c" x="55" y="170" width="180" height="160"/><text class="h" x="80" y="215">Login Request</text><text class="p" x="80" y="245">email + password</text><text class="p" x="80" y="268">browser form</text><rect class="bad" x="285" y="90" width="230" height="140"/><text class="h" x="310" y="135">Vulnerable Flow</text><text class="p" x="310" y="163">no throttling</text><text class="p" x="310" y="186">local/testing only</text><rect class="c" x="285" y="245" width="230" height="140"/><text class="h" x="310" y="290">Standard Flow</text><text class="p" x="310" y="318">validation + session regen</text><text class="p" x="310" y="341">generic errors</text><rect class="ok" x="565" y="170" width="240" height="160"/><text class="h" x="590" y="215">Hardened Flow</text><text class="p" x="590" y="245">rate limiting</text><text class="p" x="590" y="268">CSRF + secure logout</text><rect class="c" x="855" y="170" width="220" height="160"/><text class="h" x="880" y="215">Laravel Auth Layer</text><text class="p" x="880" y="245">middleware</text><text class="p" x="880" y="268">session boundary</text><rect class="c" x="1125" y="170" width="220" height="160"/><text class="h" x="1150" y="215">Protected Dashboard</text><text class="p" x="1150" y="245">authenticated only</text><text class="p" x="1150" y="268">secure logout</text><path class="x" d="M235 220C255 220 255 160 285 160"/><path class="x" d="M235 280C255 280 255 315 285 315"/><path class="x" d="M515 160C540 160 540 220 565 220"/><path class="x" d="M515 315C540 315 540 280 565 280"/><path class="x" d="M805 250H855"/><path class="x" d="M1075 250H1125"/><text class="st" x="70" y="470">The intentionally weak path is isolated to local/testing environments and must never be exposed in production.</text></svg>