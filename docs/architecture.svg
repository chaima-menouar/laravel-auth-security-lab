<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Laravel Authentication Security Lab architecture</title><desc id="desc">Three authentication flows converge on Laravel authentication, protected sessions, and the dashboard, while the vulnerable flow is restricted to local and testing environments.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="35" y="135" width="160" height="90"/><text class="t" x="115" y="170" text-anchor="middle">User</text><text class="s" x="115" y="198" text-anchor="middle">login request</text><rect class="b" x="260" y="35" width="210" height="80"/><text class="t" x="365" y="68" text-anchor="middle">Vulnerable Flow</text><text class="s" x="365" y="94" text-anchor="middle">local/testing only</text><rect class="b" x="260" y="140" width="210" height="80"/><text class="t" x="365" y="173" text-anchor="middle">Standard Flow</text><text class="s" x="365" y="199" text-anchor="middle">validation + sessions</text><rect class="b" x="260" y="245" width="210" height="80"/><text class="t" x="365" y="278" text-anchor="middle">Secure Flow</text><text class="s" x="365" y="304" text-anchor="middle">throttling + hardening</text><rect class="b" x="555" y="135" width="200" height="90"/><text class="t" x="655" y="170" text-anchor="middle">Laravel Auth</text><text class="s" x="655" y="198" text-anchor="middle">session regeneration</text><rect class="b" x="835" y="135" width="220" height="90"/><text class="t" x="945" y="170" text-anchor="middle">Protected Dashboard</text><text class="s" x="945" y="198" text-anchor="middle">auth middleware + CSRF</text><path class="a" d="M195 180 C225 180 225 75 260 75"/><path class="a" d="M195 180 H260"/><path class="a" d="M195 180 C225 180 225 285 260 285"/><path class="a" d="M470 75 C520 75 515 155 555 165"/><path class="a" d="M470 180 H555"/><path class="a" d="M470 285 C520 285 515 205 555 195"/><path class="a" d="M755 180 H835"/></svg>